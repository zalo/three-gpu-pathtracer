<!DOCTYPE html>
<html>
	<head>
		<title>WebGPU Material Gallery</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
		<style>
			html, body {
				margin: 0;
				padding: 0;
				background-color: #111;
				overflow: hidden;
			}
			canvas {
				display: block;
				width: 100%;
				height: 100%;
			}
			#info {
				position: absolute;
				bottom: 16px;
				left: 16px;
				font-family: 'Courier New', Courier, monospace;
				color: #aaa;
				font-size: 14px;
				z-index: 10;
			}
			#model-select {
				position: absolute;
				top: 16px;
				left: 16px;
				font-family: 'Courier New', Courier, monospace;
				font-size: 14px;
				z-index: 10;
				padding: 6px 10px;
				background: rgba(0,0,0,0.6);
				color: #ccc;
				border: 1px solid #555;
				border-radius: 4px;
			}
			#credit {
				position: absolute;
				bottom: 16px;
				right: 16px;
				font-family: 'Courier New', Courier, monospace;
				color: #666;
				font-size: 12px;
				z-index: 10;
			}
			#progress-bar {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 320px;
				z-index: 20;
				font-family: 'Courier New', Courier, monospace;
				color: #ccc;
				font-size: 14px;
				text-align: center;
				display: none;
			}
			#progress-bar.visible { display: block; }
			#progress-bar .bar-bg {
				width: 100%;
				height: 4px;
				background: #333;
				border-radius: 2px;
				margin-top: 8px;
				overflow: hidden;
			}
			#progress-bar .bar-fill {
				height: 100%;
				background: #fff;
				border-radius: 2px;
				width: 0%;
				transition: width 0.15s;
			}
		</style>
		<script type="module" crossorigin src="./assets/webgpu-material-DxojXyVO.js"></script>
		<link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
		<link rel="modulepreload" crossorigin href="./assets/tinybvh-DWvKZLYk.js">
		<link rel="modulepreload" crossorigin href="./assets/three.module-Blrp6k_f.js">
		<link rel="modulepreload" crossorigin href="./assets/BufferGeometryUtils-Zh2-_A6i.js">
		<link rel="modulepreload" crossorigin href="./assets/GLTFLoader-C-EdhZKZ.js">
		<link rel="modulepreload" crossorigin href="./assets/DRACOLoader-h5p0JnJ2.js">
		<link rel="modulepreload" crossorigin href="./assets/OrbitControls-Dj5eCKTt.js">
		<link rel="modulepreload" crossorigin href="./assets/HDRLoader-BzzhXPKe.js">
		<link rel="modulepreload" crossorigin href="./assets/SceneProcessor-RKFk9Qoc.js">
	</head>
	<body>
		<canvas id="canvas"></canvas>
		<select id="model-select"></select>
		<div id="credit"></div>
		<div id="info"></div>
		<div id="progress-bar">
			<div id="progress-label">Loading...</div>
			<div class="bar-bg"><div class="bar-fill" id="progress-fill"></div></div>
		</div>
	</body>
</html>
